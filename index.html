<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Piloto de Pago</title>
    <!-- 1. Cargamos el SDK de Mercado Pago -->
    <script src="https://mercadopago.com"></script>
</head>
<body>

    <div style="border: 1px solid #ccc; padding: 20px; max-width: 300px; text-align: center; border-radius: 8px; margin: 20px auto;">
        <h2>Artículo de Prueba</h2>
        <p>Precio Unitario: <strong>$1500.00</strong></p>
        
        <!-- Controles de cantidad -->
        <div style="margin-bottom: 20px;">
            <button id="btn-menos" style="padding: 5px 15px; font-size: 18px;">-</button>
            <span id="cantidad-txt" style="font-size: 18px; margin: 0 15px; font-weight: bold;">1</span>
            <button id="btn-mas" style="padding: 5px 15px; font-size: 18px;">+</button>
        </div>

        <!-- Botón de Pago Único -->
        <button id="btn-pagar" style="background-color: #009ee3; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%;">
            Pagar con Mercado Pago
        </button>
    </div>

    <script>
        // 2. Inicializamos Mercado Pago con tu Public Key de prueba
        const mp = new mercadopago("APP_USR-0e7e7f45-ebbd-42a8-aab5-cf85fb927445", { locale: "es-AR" });

        let cantidad = 1;
        const urlBackend = "https://erp-backend-bsyv.onrender.com";

        // Manejo del contador visual
        document.getElementById("btn-mas").addEventListener("click", () => {
            cantidad++;
            document.getElementById("cantidad-txt").innerText = cantidad;
        });

        document.getElementById("btn-menos").addEventListener("click", () => {
            if (cantidad > 1) {
                cantidad--;
                document.getElementById("cantidad-txt").innerText = cantidad;
            }
        });

        // 3. Evento para llamar a Render y abrir el checkout en el celular
        document.getElementById("btn-pagar").addEventListener("click", async () => {
            try {
                // Deshabilitamos el botón para evitar doble clic
                document.getElementById("btn-pagar").innerText = "Procesando...";
                
                // Pedimos el ID de la preferencia enviando la cantidad elegida
                const response = await fetch(urlBackend, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cantidad: cantidad })
                });
                
                const data = await response.json();

                if (data.id) {
                    // Abrimos Mercado Pago en la misma pestaña (ideal para app celular)
                    mp.checkout({
                        preference: { id: data.id },
                        autoOpen: true
                    });
                } else {
                    alert("Error al generar el pago");
                    document.getElementById("btn-pagar").innerText = "Pagar con Mercado Pago";
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión");
                document.getElementById("btn-pagar").innerText = "Pagar con Mercado Pago";
            }
        });
    </script>
</body>
</html>
